<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Tools</title>
    <script>
      try {
        const raw = localStorage.getItem("music_tools_settings_v1");
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed.themePreset) document.documentElement.setAttribute("data-theme", parsed.themePreset);
          if (parsed.themeMode) document.documentElement.setAttribute("data-mode", parsed.themeMode);
        }
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
