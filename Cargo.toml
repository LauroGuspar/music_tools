[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
core = { path = "crates/core" }
storage = { path = "crates/storage" }
matcher = { path = "crates/matcher" }
scanner = { path = "crates/scanner" }
downloader = { path = "crates/downloader" }
ui = { path = "crates/ui" }
gpui = { git = "https://github.com/sonorahq/gpui", rev = "439295d5c1e21682a704b93a6ade6a7d5a585ccd" }
gpui_platform = { git = "https://github.com/sonorahq/gpui", rev = "439295d5c1e21682a704b93a6ade6a7d5a585ccd", features = [
  "font-kit",
  "wayland",
  "x11",
] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = "0.32"
log = "0.4"
env_logger = "0.11"
regex = "1.11"
unicode-normalization = "0.1"
lofty = "0.21"
walkdir = "2.5"
rayon = "1.10"
sha2 = "0.10"
tokio = { version = "1.43", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  "process",
] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
spotify = { path = "crates/spotify" }
librespot-core = { version = "0.8.0", default-features = false, features = [
  "rustls-tls-native-roots",
] }
librespot-oauth = { version = "0.8.0", default-features = false, features = [
  "rustls-tls-native-roots",
] }
librespot-protocol = "0.8.0"
protobuf = "3"
oauth2 = "5.0"
open = "5.4"
dirs = "6.0"
http = "1"
percent-encoding = "2.3"

[patch.crates-io]
librespot-core = { git = "https://github.com/sonorahq/librespot", rev = "f5da0664e93b601cafa48ea41b5f08153b3c4f31" }
librespot-oauth = { git = "https://github.com/sonorahq/librespot", rev = "f5da0664e93b601cafa48ea41b5f08153b3c4f31" }
librespot-protocol = { git = "https://github.com/sonorahq/librespot", rev = "f5da0664e93b601cafa48ea41b5f08153b3c4f31" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2
