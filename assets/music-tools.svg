<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.6" />
    </linearGradient>

    <!-- Emerald Primary Gradient for Notes -->
    <linearGradient id="emerald-note" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="35%" stop-color="#10b981" />
      <stop offset="85%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Glow Gradient -->
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Accent Beam Gradient -->
    <linearGradient id="beam-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Waveform Glow -->
    <linearGradient id="wave-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="70%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>

    <!-- Filter for subtle drop shadow -->
    <filter id="note-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10b981" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Icon Container (Modern Rounded Squircle) -->
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="4" />

  <!-- Ambient Emerald Radial Glow Behind Note -->
  <circle cx="256" cy="245" r="180" fill="url(#center-glow)" />

  <!-- Geometric Soundwave / Equalizer Bars on background -->
  <g opacity="0.22">
    <rect x="74" y="270" width="10" height="40" rx="5" fill="url(#wave-grad)" />
    <rect x="94" y="240" width="10" height="70" rx="5" fill="url(#wave-grad)" />
    <rect x="114" y="260" width="10" height="50" rx="5" fill="url(#wave-grad)" />
    <rect x="388" y="250" width="10" height="60" rx="5" fill="url(#wave-grad)" />
    <rect x="408" y="230" width="10" height="80" rx="5" fill="url(#wave-grad)" />
    <rect x="428" y="265" width="10" height="45" rx="5" fill="url(#wave-grad)" />
  </g>

  <!-- Main Musical Double-Note Glyph -->
  <g filter="url(#note-shadow)">
    <!-- Top Connecting Beam -->
    <path d="M192 142 L344 110 L344 154 L192 186 Z" fill="url(#beam-grad)" />
    <path d="M192 198 L344 166 L344 186 L192 218 Z" fill="url(#beam-grad)" opacity="0.85" />

    <!-- Left Stem -->
    <rect x="192" y="152" width="22" height="178" rx="4" fill="url(#emerald-note)" />

    <!-- Right Stem -->
    <rect x="322" y="120" width="22" height="178" rx="4" fill="url(#emerald-note)" />

    <!-- Left Note Head (Angled Ellipse) -->
    <ellipse cx="168" cy="336" rx="46" ry="34" transform="rotate(-24 168 336)" fill="url(#emerald-note)" />
    <!-- Specular Highlight Left -->
    <ellipse cx="162" cy="330" rx="28" ry="16" transform="rotate(-24 162 330)" fill="#a7f3d0" opacity="0.3" />

    <!-- Right Note Head (Angled Ellipse) -->
    <ellipse cx="298" cy="304" rx="46" ry="34" transform="rotate(-24 298 304)" fill="url(#emerald-note)" />
    <!-- Specular Highlight Right -->
    <ellipse cx="292" cy="298" rx="28" ry="16" transform="rotate(-24 292 298)" fill="#a7f3d0" opacity="0.3" />
  </g>

  <!-- Modern Accent: Play/Tool Triangle Accent -->
  <path d="M374 380 L388 388 L374 396 Z" fill="#34d399" opacity="0.6" />
</svg>
